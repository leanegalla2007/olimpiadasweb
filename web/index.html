<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff; /* Color azul para diferenciarlo del botón verde de guardar */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        </style>
        
</head>
<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Ingresá tu usuario">
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required placeholder="Ingresá tu contraseña">
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
        <form id="registroForm">
            <button type="submit" class="btn-submit">Registrar cuenta</button>
        </form>
    </div>

</body>
                    <script>
                // Este script simula el inicio de sesión y te lleva a la otra página
                document.getElementById('registroForm').addEventListener('submit', function(event) {
                    event.preventDefault(); // Evita que la página intente enviar datos a un servidor inexistente
                    
                    // Acá hacemos la "conexión". Al hacer clic, te redirige al formulario.
                    // Es importante que el otro archivo se llame exactamente 'formulario.html'
                    window.location.href = 'registro.html'; 
                });
            </script>
</html>
