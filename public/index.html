<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">

</head>
<body class="IniciarSesionStyle">

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            
            <div class="form-group">
                <label for="nombre_usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Ingresá tu usuario">
            </div>

            <div class="form-group">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contrasena" required placeholder="Ingresá tu contraseña">
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
        <form id="registroForm">
            <button type="submit" class="btn-submit">Registrar cuenta</button>
        </form>
    </div>

</body>
<script>
    const API_URL = 'http://localhost:3000/api';           // Este script simula el inicio de sesión y te lleva a la otra página
    
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault(); // Evita que la página se recargue sola

    // Capturamos los valores de los inputs
    const usuarioInput = document.getElementById("usuario").value;
    const contrasenaInput = document.getElementById("contraseña").value;
    const credenciales = {
        nombre_usuario: document.getElementById("usuario").value, // Asegurate que el ID en tu input sea 'usuario'
        contraseña: document.getElementById("contraseña").value     // Asegurate que el ID en tu input sea 'contrasena'
    };

    try {
        // Hacemos la petición POST a nuestra API
        const respuesta = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usuario: usuarioInput,
                contrasena: contrasenaInput
            })
        });

        const resultado = await respuesta.json();

        if (respuesta.ok) {
            alert(resultado.mensaje);
            // Si querés que vaya a la otra página después de registrarse:
            window.location.href = "configuracion.html"; 
        } else {
            alert("Error: " + resultado.error);
        }

    } catch (error) {
        console.error("Error de conexión:", error);
        alert("No se pudo conectar con el servidor.");
    }
});
document.getElementById('registroForm').addEventListener('submit', function(event) {
event.preventDefault(); // Evita que la página intente enviar datos a un servidor inexistente
                    
                    // Acá hacemos la "conexión". Al hacer clic, te redirige al formulario.
                    // Es importante que el otro archivo se llame exactamente 'formulario.html'
window.location.href = 'registro.html'; 
});
</script>
</html>
