<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ficha de Empleado - Parque Ambiental</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <div>
            <div class="sidebar-header">
                <h2>🌱 Parque Ambiental</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="panelcontrol.html">📊 Monitoreo General</a></li>
                <li><a href="configuracion.html">⚙️ Configuración y Áreas</a></li>
                <li class="active"><a href="empleados.html">👥 Ficha de Empleados</a></li>
                <li><a href="historial.html">📜 Historial General</a></li>
                <li><a href="reportes.html">📈 Reportes Estadísticos</a></li>
            </ul>
        </div>
    </aside>
    <main>
        <header class="top-navbar">
            <div class="nav-brand-title">Creación de Ficha y Datos Personales</div>
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info">
                    <span>Administrador</span>
                    <strong>Acceso Irrestricto</strong>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="form-container">
                <form onsubmit="registrarEmpleado(event)">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" placeholder="Ej: Lauryn" required>
                    </div>
                    <div>
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" placeholder="Ej: Riveros" required>
                    </div>
                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" placeholder="Ej: 41.234.567" required>
                    </div>
                    <div class="form-group">
                        <label for="especialidad">Tarea Asignada en el Parque:</label>
                        <input type="text" id="tarea" placeholder="Ej: Control de Riego y Sensores" required>
                    </div>
                    <div class="form-group">
                        <label for="horario_entrada">Horario de Entrada:</label>
                        <input type="time" id="horario_entrada" placeholder="Ej: 10:00 hs" required>
                    </div>
                    <div class="form-group">
                        <label for="horario_salida">Horario de Salida:</label>
                        <input type="time" id="horario_salida" placeholder="Ej: 14:00 hs" required>
                    </div>
                    <div class="form-group">
                        <label for="rol">Tipo de Usuario / Jerarquía:</label>
                        <select id="tipo">
                            <option>Genérico / Empleado</option>
                            <option>Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Ficha</button>
                    <a href="empleados.html" class="btn btn-secondary" style="margin-left: 10px; text-decoration: none;">Cancelar</a>
                </form>
            </div>
        </div>
    </main>
    <script src="js/app.js">
        const API_URL = 'http://localhost:3000/api/empleados'; // Asegurate de definir tu URL base o completa

document.getElementById("form-area").addEventListener('submit', async (e) => {
    e.preventDefault();

    const nombre = document.getElementById('nombre').value;
    const origen = document.getElementById('origen').value;
    const admin = document.getElementById('admin').value;
    const sensores = document.getElementById('sensores').value;

    try {
        const respuesta = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, origen, admin, sensores })
        });

        if (respuesta.ok) {
            alert('¡Área agregada con éxito!');
            
            // Como es un HTML aparte, lo mandamos de vuelta a la pantalla de configuración
            window.location.href = "configuracion.html"; 
        } else {
            const errorData = await respuesta.json();
            alert('Error: ' + (errorData.error || errorData.message));  
        }
    } catch (error) {
        console.error(error);
        alert('No se pudo conectar con el servidor.');
    }
});


    </script>
</body>
</html>
