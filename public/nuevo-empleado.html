<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ficha de Empleado - Parque Ambiental</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <div>
            <div class="sidebar-header">
                <h2>🌱 Parque Ambiental</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="panelcontrol.html">📊 Monitoreo General</a></li>
                <li><a href="configuracion.html">⚙️ Configuración y Áreas</a></li>
                <li class="active"><a href="empleados.html">👥 Ficha de Empleados</a></li>
                <li><a href="historial.html">📜 Historial General</a></li>
                <li><a href="reportes.html">📈 Reportes Estadísticos</a></li>
            </ul>
        </div>
    </aside>
    <main>
        <header class="top-navbar">
            <div class="nav-brand-title">Creación de Ficha y Datos Personales</div>
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info">
                    <span>Administrador</span>
                    <strong>Acceso Irrestricto</strong>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="form-container">
                <form onsubmit="registrarEmpleado(event)">
                    <div class="form-group">
                        <label>Nombre y Apellido:</label>
                        <input type="text" id="emp-nombre" placeholder="Ej: Lauryn Rivero" required>
                    </div>
                    <div class="form-group">
                        <label>DNI:</label>
                        <input type="text" id="emp-dni" placeholder="Ej: 41.234.567" required>
                    </div>
                    <div class="form-group">
                        <label>Tarea Asignada en el Parque:</label>
                        <input type="text" id="emp-tarea" placeholder="Ej: Control de Riego y Sensores" required>
                    </div>
                    <div class="form-group">
                        <label>Horario de Trabajo:</label>
                        <input type="text" id="emp-horario" placeholder="Ej: 10:00 a 14:00 hs" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Usuario / Jerarquía:</label>
                        <select id="emp-tipo">
                            <option>Genérico / Empleado</option>
                            <option>Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Ficha</button>
                    <a href="empleados.html" class="btn btn-secondary" style="margin-left: 10px; text-decoration: none;">Cancelar</a>
                </form>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
