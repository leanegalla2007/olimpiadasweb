<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Evento - Parque Ambiental</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <div>
            <div class="sidebar-header">
                <h2>🌱 Parque Ambiental</h2>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><a href="panelcontrol.html">📊 Monitoreo General</a></li>
                <li><a href="configuracion.html">⚙️ Configuración y Áreas</a></li>
                <li><a href="empleados.html">👥 Ficha de Empleados</a></li>
                <li><a href="historial.html">📜 Historial General</a></li>
                <li><a href="reportes.html">📈 Reportes Estadísticos</a></li>
            </ul>
        </div>
    </aside>
    <main>
        <header class="top-navbar">
            <div class="nav-brand-title">Registrar Nuevo Evento o Llamado</div>
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info">
                    <span>Administrador</span>
                    <strong>Acceso Irrestricto</strong>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="form-container">
                <form onsubmit="registrarEvento(event)">
                    <div class="form-group">
                        <label>Área / Origen del Evento:</label>
                        <select id="area-evento">
                            <option>Invernadero Principal (Arduino)</option>
                            <option>Sector Hidroponia</option>
                            <option>Vivero Externo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Llamado:</label>
                        <select id="tipo-llamado">
                            <option>Normal (Reporte de empleado)</option>
                            <option style="color: red;">Emergencia (Alerta de sensores)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descripción detallada:</label>
                        <textarea id="descripcion" rows="4" placeholder="Ingrese los detalles de la novedad..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Evento</button>
                    <a href="panelcontrol.html" class="btn btn-secondary" style="margin-left: 10px; text-decoration: none;">Cancelar</a>
                </form>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        const API_URL_LLAMADOS = 'http://localhost:3000/api/llamados';

document.getElementById("form-llamado").addEventListener('submit', async (e) => {
    e.preventDefault();

    const area = document.getElementById('area_evento').value; // Asegurate que el ID coincida con tu select
    const tipo_llamado = document.getElementById('tipo_llamado').value;
    const descripcion = document.getElementById('descripcion').value;

    try {
        const respuesta = await fetch(API_URL_LLAMADOS, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ area, tipo_llamado, descripcion })
        });

        if (respuesta.ok) {
            alert('¡Alerta / Llamado registrado con éxito!');
            window.location.href = "monitoreo.html"; // O la página principal donde está la tabla
        } else {
            const errorData = await respuesta.json();
            alert('Error: ' + errorData.error);  
        }
    } catch (error) {
        console.error(error);
        alert('No se pudo conectar con el servidor.');
    }
});
    </script>
</body>
</html>
