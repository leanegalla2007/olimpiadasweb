<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Área / Invernadero - Parque Ambiental</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <div>
            <div class="sidebar-header">
                <h2>🌱 Parque Ambiental</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="panelcontrol.html">📊 Monitoreo General</a></li>
                <li class="active"><a href="configuracion.html">⚙️ Configuración y Áreas</a></li>
                <li><a href="empleados.html">👥 Ficha de Empleados</a></li>
                <li><a href="historial.html">📜 Historial General</a></li>
                <li><a href="reportes.html">📈 Reportes Estadísticos</a></li>
            </ul>
        </div>
    </aside>
    <main>
        <header class="top-navbar">
            <div class="nav-brand-title">Crear Nueva Área o Invernadero</div>
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info">
                    <span>Administrador</span>
                    <strong>Acceso Irrestricto</strong>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="form-container">
                <form id="form-area" onsubmit="registrarArea(event)">
                    <div class="form-group">
                        <label for="nombre">Nombre del Área / Invernadero:</label>
                        <input type="text" id="nombre" placeholder="Ej: Invernadero 2" required>
                    </div>
                    <div class="form-group">
                        <label for="origen">Categoría de Origen:</label>
                        <select id="origen">
                            <option>Invernaderos</option>
                            <option>Hidroponia</option>
                            <option>Cultivos Externos</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="admin" class="form-label">Administrador Asignado</label>
                        <select id="admin" class="form-select" required>
                            <option value="" disabled selected>Seleccione un administrador...</option>
                        </select>   
                    </div>
                    <div class="form-group">
                        <label for="sensores">Sensores Arduino Asociados:</label>
                        <input type="text" id="sensores" placeholder="Ej: DHT22 (Temp/Humedad)" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Crear Área</button>
                    <a href="configuracion.html" class="btn btn-secondary" style="margin-left: 10px; text-decoration: none;">Cancelar</a>
                </form>
            </div>
        </div>
    </main>
    <script>
        const API_URL = 'http://localhost:3000/api/areas'; // Asegurate de definir tu URL base o completa

document.getElementById("form-area").addEventListener('submit', async (e) => {
    e.preventDefault();

    const nombre = document.getElementById('nombre').value;
    const origen = document.getElementById('origen').value;
    const admin = document.getElementById('admin').value;
    const sensores = document.getElementById('sensores').value;

    try {
        const respuesta = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, origen, admin, sensores })
        });

        if (respuesta.ok) {
            alert('¡Área agregada con éxito!');
            
            // Como es un HTML aparte, lo mandamos de vuelta a la pantalla de configuración
            window.location.href = "configuracion.html"; 
        } else {
            const errorData = await respuesta.json();
            alert('Error: ' + (errorData.error || errorData.message));  
        }
    } catch (error) {
        console.error(error);
        alert('No se pudo conectar con el servidor.');
    }
});

// Función para cargar los usuarios en el select al abrir la página
async function cargarUsuariosEnSelect() {
    try {
        const respuesta = await fetch('http://localhost:3000/api/usuarios');
        const usuarios = await respuesta.json();

        const selectAdmin = document.getElementById('admin');

        usuarios.forEach(user => {
            const option = document.createElement('option');
            // Guardamos el nombre completo (o el ID, según prefieras mostrar)
            const nombreCompleto = `${user.nombre} ${user.apellido}`;
            option.value = nombreCompleto; 
            option.textContent = nombreCompleto;
            selectAdmin.appendChild(option);
        });
    } catch (error) {
        console.error("Error al cargar los administradores:", error);
    }
}

// Ejecutar al cargar la página
window.addEventListener('DOMContentLoaded', cargarUsuariosEnSelect);
</script>
</body>
</html>
