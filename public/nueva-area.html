<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Área / Invernadero - Parque Ambiental</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <div>
            <div class="sidebar-header">
                <h2>🌱 Parque Ambiental</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="panelcontrol.html">📊 Monitoreo General</a></li>
                <li class="active"><a href="configuracion.html">⚙️ Configuración y Áreas</a></li>
                <li><a href="empleados.html">👥 Ficha de Empleados</a></li>
                <li><a href="historial.html">📜 Historial General</a></li>
                <li><a href="reportes.html">📈 Reportes Estadísticos</a></li>
            </ul>
        </div>
    </aside>
    <main>
        <header class="top-navbar">
            <div class="nav-brand-title">Crear Nueva Área o Invernadero</div>
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info">
                    <span>Administrador</span>
                    <strong>Acceso Irrestricto</strong>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="form-container">
                <form id="form-area" onsubmit="registrarArea(event)">
                    <div class="form-group">
                        <label for="nombre_area">Nombre del Área / Invernadero:</label>
                        <input type="text" id="area-nombre" placeholder="Ej: Invernadero 2" required>
                    </div>
                    <div class="form-group">
                        <label for="origen">Categoría de Origen:</label>
                        <select id="area-origen">
                            <option>Invernaderos</option>
                            <option>Hidroponia</option>
                            <option>Cultivos Externos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="admin">Administrador Asignado:</label>
                        <input type="text" id="area-admin" placeholder="Nombre del Administrador" required>
                    </div>
                    <div class="form-group">
                        <label for="sensores">Sensores Arduino Asociados:</label>
                        <input type="text" id="area-sensores" placeholder="Ej: DHT22 (Temp/Humedad)" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Crear Área</button>
                    <a href="configuracion.html" class="btn btn-secondary" style="margin-left: 10px; text-decoration: none;">Cancelar</a>
                </form>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        document.getElementById("form-area").addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre_area').value;
            const origen = document.getElementById('origen').value;
            const admin = document.getElementById('admin').value;
            const sensores = document.getElementById('sensores').value;

            try {
                const respuesta = await fetch (API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nombre, origen, admin, sensores})
                });
                if (respuesta.ok) {
                    alert ('Docente agregado a la lista con exito');
                    document.getElementById('form-group').reset();

                    const modalArea = bootstrap.Modal.getInstance(document.getElementById('modalArea'));
                    modalElemento.hide();

                    cargarLista();
                } else {
                    const errorData = await respuesta.json();
                    alert('Error: ' + errorData.message);  
                }
            } catch (error) {
                console.error(error);
                alert('No se pudo enviar el elemento al servidor');
            }
        });

        window.addEventListener('DOMContentLoaded', cargarLista);
    </script>
</body>
</html>
